name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Sync Supabase service role secret
        if: ${{ secrets.NEXORA_SUPABASE_SERVICE_ROLE_KEY != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: echo "${{ secrets.NEXORA_SUPABASE_SERVICE_ROLE_KEY }}" | npx wrangler secret put NEXORA_SUPABASE_SERVICE_ROLE_KEY
      - name: Sync Google OAuth client id
        if: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: echo "${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}" | npx wrangler secret put GOOGLE_OAUTH_CLIENT_ID
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config .output/server/wrangler.json
      - name: Health check (keepalive)
        run: |
          URL="${{ secrets.NEXORA_WORKER_URL }}"
          if [ -z "$URL" ]; then URL="https://trip-trilogy.workers.dev"; fi
          echo "Checking $URL/api/public/keepalive"
          curl --fail --show-error --silent --retry 3 --retry-delay 5 "$URL/api/public/keepalive"
