name: Keep Nexora services active

# DISABLED as an automatic scheduler: a native Cloudflare Cron Trigger
# (`wrangler.toml` → [triggers] crons = "*/10 * * * *") now keeps the Worker
# and Supabase warm entirely inside Cloudflare, handled by
# server/plugins/keepalive.ts. This workflow is kept as a manual backstop
# (Actions → "Run workflow") — it no longer runs on a schedule, so it can't
# produce false "failed" notification emails for a healthy service.
on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ping Cloudflare Worker keepalive
        env:
          NEXORA_WORKER_URL: ${{ secrets.NEXORA_WORKER_URL }}
        run: |
          URL="${NEXORA_WORKER_URL:-https://trip-trilogy.sheethappenswithjaa.workers.dev}"
          ENDPOINT="$URL/api/public/keepalive"
          echo "Pinging $ENDPOINT"
          # The keepalive endpoint always answers HTTP 200 once reachable, so the
          # only realistic failure is a short-lived GitHub-runner -> Cloudflare
          # egress blip or a deploy-propagation 503. Retry for up to ~5 minutes
          # so those transient gaps recover *inside this run* instead of emailing
          # a false "failed" for a healthy service.
          deadline=$((SECONDS + 300))
          attempt=0
          while :; do
            attempt=$((attempt + 1))
            if curl --fail --show-error --silent \
              --connect-timeout 15 --max-time 60 "$ENDPOINT"; then
              echo "keepalive OK (attempt $attempt)"
              exit 0
            fi
            echo "keepalive attempt $attempt failed; retrying in 15s..."
            if (( SECONDS >= deadline )); then
              echo "keepalive still unreachable after $attempt attempts over ~5m" >&2
              exit 1
            fi
            sleep 15
          done
