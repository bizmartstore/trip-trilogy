name: Keep Nexora services active

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping published Nexora endpoint
        run: curl --fail --show-error --silent --retry 2 https://trip-trilogy.lovable.app/api/public/keepalive