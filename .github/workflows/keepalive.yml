name: Keep Nexora services active

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Ping Cloudflare Worker keepalive
        env:
          NEXORA_WORKER_URL: ${{ secrets.NEXORA_WORKER_URL }}
        run: |
          URL="${NEXORA_WORKER_URL:-https://trip-trilogy.sheethappenswithjaa.workers.dev}"
          echo "Pinging $URL/api/public/keepalive"
          # Tolerate brief deploy windows / cold-start blips: retry transient
          # and HTTP errors several times before marking the run as failed.
          curl --fail --show-error --silent \
            --retry 4 --retry-delay 10 --retry-all-errors \
            --connect-timeout 15 --max-time 90 \
            "$URL/api/public/keepalive"
