# Cloudflare Worker deploy for Nexora (TanStack Start + Nitro).
#
# Required secrets (never commit values here):
#   wrangler secret put NEXORA_SUPABASE_SERVICE_ROLE_KEY
#   wrangler secret put GOOGLE_OAUTH_CLIENT_ID   # required for Google sign-in (same Web client ID as Supabase Google provider)
#   wrangler secret put ONESIGNAL_REST_API_KEY   # OneSignal Dashboard → Settings → Keys & IDs → REST API Key
#   wrangler secret put TELEGRAM_BOT_TOKEN       # BotFather token (admin group alerts)
#   wrangler secret put TELEGRAM_CHAT_ID         # Main Telegram group (new + rejected)
#   wrangler secret put TELEGRAM_APPROVED_CHAT_ID # Approved-bookings Telegram group
#   wrangler secret put TELEGRAM_REMINDER_CHAT_ID # Day-before / day-of reminder group
#
# Or add GitHub Actions secrets (recommended — deploy workflow syncs them):
#   NEXORA_SUPABASE_SERVICE_ROLE_KEY
#   GOOGLE_OAUTH_CLIENT_ID
#   ONESIGNAL_REST_API_KEY
#   TELEGRAM_BOT_TOKEN
#   TELEGRAM_CHAT_ID
#   TELEGRAM_APPROVED_CHAT_ID
#   TELEGRAM_REMINDER_CHAT_ID
#   CLOUDFLARE_API_TOKEN
#   CLOUDFLARE_ACCOUNT_ID
#   NEXORA_WORKER_URL   # e.g. https://trip-trilogy.workers.dev or your custom domain
#
# Local dev: copy .env.example to .dev.vars
name = "trip-trilogy"
main = ".output/server/index.mjs"
compatibility_date = "2026-08-14"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".output/public"
binding = "ASSETS"

[vars]
NEXORA_SUPABASE_URL = "https://aeynekfhnzjcimskwouw.supabase.co"
SUPABASE_URL = "https://aeynekfhnzjcimskwouw.supabase.co"
VITE_SUPABASE_URL = "https://aeynekfhnzjcimskwouw.supabase.co"
ONESIGNAL_APP_ID = "4efad5e2-6b5d-4691-86e4-618ea8c97493"
VITE_ONESIGNAL_APP_ID = "4efad5e2-6b5d-4691-86e4-618ea8c97493"
# Optional public Web client ID (same as Supabase → Auth → Google). Prefer Worker secret above.
# GOOGLE_OAUTH_CLIENT_ID = "your-id.apps.googleusercontent.com"

# Optional: attach a custom domain (uncomment and set your route)
# [[routes]]
# pattern = "nexora.example.com/*"
# zone_name = "example.com"